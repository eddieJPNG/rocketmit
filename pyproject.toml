[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketmit"
version = "0.1.0"
description = "CLI para formatar mensagens de commit"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rocketmmit = "commitrocket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]